<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoji Burst</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0f13;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #fff;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    p {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    #launch-btn {
      position: relative;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 24px rgba(124, 58, 237, 0.45);
      z-index: 10;
    }

    #launch-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(124, 58, 237, 0.6);
    }

    #launch-btn:active {
      transform: translateY(0);
    }

    #launch-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    #clear-btn {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 12px 30px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
                  background 0.2s, opacity 0.4s;
      opacity: 0;
      z-index: 100;
    }

    #clear-btn.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #clear-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* Floating emoji */
    .emoji-particle {
      position: fixed;
      font-size: 2rem;
      pointer-events: none;
      user-select: none;
      z-index: 50;
      animation: floatUp var(--dur) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.4) rotate(0deg); }
      15%  { opacity: 1; transform: translateY(-60px) scale(1.1) rotate(var(--rot1)); }
      80%  { opacity: 1; transform: translateY(var(--rise)) scale(1) rotate(var(--rot2)); }
      100% { opacity: 0; transform: translateY(var(--rise-end)) scale(0.8) rotate(var(--rot3)); }
    }

    /* Ripple on button click */
    @keyframes ripple {
      to { transform: scale(3); opacity: 0; }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.25);
      transform: scale(0);
      animation: ripple 0.5s linear;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <h1>Emoji Burst ✨</h1>
  <p>Hit the button and watch the magic</p>

  <button id="launch-btn">Launch Emojis 🚀</button>
  <button id="clear-btn">Clear Screen</button>

  <script>
    const EMOJIS = ['🎉','✨','🌟','💫','🎊','🔥','💥','🌈','🦄','🎈','💖','🍀'];
    const COUNT  = 18;

    const launchBtn = document.getElementById('launch-btn');
    const clearBtn  = document.getElementById('clear-btn');

    let particles = [];

    function randomBetween(a, b) {
      return a + Math.random() * (b - a);
    }

    function spawnEmojis() {
      launchBtn.disabled = true;

      for (let i = 0; i < COUNT; i++) {
        setTimeout(() => {
          const el = document.createElement('span');
          el.className = 'emoji-particle';
          el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

          const x    = randomBetween(5, 95);           // vw
          const rise = randomBetween(-55, -75);         // vh upward
          const dur  = randomBetween(2.2, 3.6);

          el.style.setProperty('--dur',      `${dur}s`);
          el.style.setProperty('--rise',     `${rise}vh`);
          el.style.setProperty('--rise-end', `${rise - 10}vh`);
          el.style.setProperty('--rot1',     `${randomBetween(-20,20)}deg`);
          el.style.setProperty('--rot2',     `${randomBetween(-40,40)}deg`);
          el.style.setProperty('--rot3',     `${randomBetween(-60,60)}deg`);
          el.style.left   = `${x}vw`;
          el.style.bottom = `${randomBetween(10, 25)}vh`;
          el.style.fontSize = `${randomBetween(1.4, 2.6)}rem`;

          document.body.appendChild(el);
          particles.push(el);

          el.addEventListener('animationend', () => {
            el.remove();
            particles = particles.filter(p => p !== el);
          });
        }, i * 80);
      }

      // Show clear button after last emoji spawns
      setTimeout(() => {
        clearBtn.classList.add('visible');
      }, COUNT * 80 + 300);
    }

    function clearScreen() {
      particles.forEach(p => p.remove());
      particles = [];
      clearBtn.classList.remove('visible');
      launchBtn.disabled = false;
    }

    launchBtn.addEventListener('click', (e) => {
      // Ripple effect
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = launchBtn.getBoundingClientRect();
      r.style.left = `${e.clientX - rect.left - 20}px`;
      r.style.top  = `${e.clientY - rect.top  - 20}px`;
      launchBtn.appendChild(r);
      r.addEventListener('animationend', () => r.remove());

      spawnEmojis();
    });

    clearBtn.addEventListener('click', clearScreen);
  </script>
</body>
</html>
